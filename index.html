<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stargazers log</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <p class="eyebrow">Open source, collected</p>
        <h1>Stargazers log</h1>
        <p class="intro">A log of the repositories I've starred.</p>
      </header>

      <section class="repository-section" aria-labelledby="repository-heading">
        <div class="section-heading">
          <h2 id="repository-heading">Starred repositories</h2>
          <p id="repository-count" class="repository-count" aria-live="polite">Loading...</p>
        </div>
        <ul id="repository-list" class="repository-list" aria-live="polite"></ul>
        <p id="load-error" class="load-error" role="alert" hidden></p>
      </section>
    </main>
    <script src="script.js" defer></script>
  </body>
</html>
